    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Account
        - AccountCToken
        - LiquidationBorrow
        - Market
      abis:
        - name: TToken
          file: ./abis/ttoken.json
        - name: Comptroller
          file: ./abis/comptroller.json
        - name: PriceFeed
          file: ./abis/PriceFeed.json
        - name: ERC20
